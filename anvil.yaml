metadata:
  description: Record your screen and camera, edit, and publish YouTube videos and Reels about the apps you build. All in
    the browser.
  logo_img: asset:icon-512.png
  title: 'VideoBlog Buddy: screen recorder and video editor for app makers'
name: VideoBlog Buddy
native_deps:
  head_html: "<script src=\"_/theme/legal-kit.js?v=22df51b7d0\"></script>\n<meta name=\"viewport\" content=\"width=device-width,\
    \ initial-scale=1, viewport-fit=cover\">\n<meta name=\"theme-color\" content=\"#cc181e\">\n<meta name=\"apple-mobile-web-app-capable\"\
    \ content=\"yes\">\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<link rel=\"preconnect\" href=\"\
    https://fonts.gstatic.com\" crossorigin>\n<link href=\"https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Condensed:wght@700&family=Anton&family=Permanent+Marker&family=Bebas+Neue&display=swap\"\
    \ rel=\"stylesheet\">\n<link id=\"ui-favicon\" rel=\"icon\" type=\"image/svg+xml\" href=\"_/theme/icon.svg?v=0347260d09\"\
    >\n<link rel=\"apple-touch-icon\" href=\"_/theme/icon-180.png?v=0347260d09\">\n<script>\n/* Keep our tab icon: Anvil adds\
    \ its own <link rel=\"icon\">, so drop any other icon link. */\n(function () {\n  function keep() {\n    var ours = document.getElementById('ui-favicon');\n\
    \    if (!ours) return;\n    document.querySelectorAll('link[rel~=\"icon\"]').forEach(function (l) { if (l !== ours) l.remove();\
    \ });\n  }\n  keep();\n  document.addEventListener('DOMContentLoaded', keep);\n  window.addEventListener('load', keep);\n\
    })();\n</script>\n<link rel=\"stylesheet\" href=\"_/theme/app.css?v=5c6d5db4c4\">\n<script src=\"_/theme/app.js?v=b4e74e443e\"\
    ></script>\n"
package_name: VideoBlog_Buddy
runtime_options:
  client_version: '3'
  server_spec:
    base: python314
  version: 3
services:
- client_config:
    enable_v2: true
  server_config: {}
  source: /runtime/services/tables.yml
- client_config:
    allow_remember_me: true
    allow_signup: true
    confirm_email: false
    enable_automatically: true
    remember_me_days: 30
    require_secure_passwords: true
    use_email: true
  server_config:
    user_table: users
  source: /runtime/services/anvil/users.yml
startup:
  module: Main
  type: form
