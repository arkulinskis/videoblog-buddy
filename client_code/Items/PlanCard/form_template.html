<div class="pl-card-host">

    <div class="row">
      <anvil-component type="Button" name="pri_button" prop:role='["pl-pri"]' prop:tooltip="How excited are you about it? (click)"></anvil-component>
      <anvil-component type="VideoBlog_Buddy.Components.AppChip" name="chip"></anvil-component>
      <anvil-component type="Label" name="due" prop:icon="" prop:role='["pl-due-l"]'></anvil-component>
      <span class="mv">
        <anvil-component type="Button" name="back_button" prop:text="◀" prop:role='["pl-mv"]'></anvil-component>
        <anvil-component type="Button" name="fwd_button" prop:text="▶" prop:role='["pl-mv"]'></anvil-component>

    </div>
  </div>
