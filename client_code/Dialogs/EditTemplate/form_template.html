<div class="ui et-dialog">
  <anvil-component type="Label" name="title" prop:role='["dlg-title"]'></anvil-component>
  <div class="ui-stack">
    <div class="ep-top">
      <label class="ui-field"><span>Emoji</span><anvil-component type="TextBox" name="emoji_box" prop:role='["ep-emoji"]'></anvil-component></label>
      <label class="ui-field"><span>Name</span><anvil-component type="TextBox" name="name_box"></anvil-component></label>
    </div>
    <label class="ui-field"><span>Format</span><anvil-component type="DropDown" name="kind_box"></anvil-component></label>
    <label class="ui-field"><span>One line about it</span><anvil-component type="TextBox" name="blurb_box"></anvil-component></label>
    <label class="ui-field"><span>Script</span><anvil-component type="TextArea" name="body_box" prop:height="260"></anvil-component></label>
    <anvil-component type="CheckBox" name="featured_box" prop:text="Featured (shown first)"></anvil-component>
    <anvil-component type="CheckBox" name="hidden_box" prop:text="Hidden"></anvil-component>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary"]'></anvil-component>
    </div>
  </div>
</div>
