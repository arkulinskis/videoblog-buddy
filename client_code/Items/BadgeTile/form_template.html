<div class="st-badge-host">

    <anvil-component type="Label" name="emoji" prop:role='["st-badge-emoji"]' bind:text="self.item['emoji']"></anvil-component>
    <anvil-component type="Label" name="label" prop:role='["st-badge-name"]' bind:text="self.item['name']"></anvil-component>
  </div>
</div>
