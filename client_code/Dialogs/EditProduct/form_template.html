<div class="ui ep-dialog">
  <anvil-component type="Label" name="title" prop:role='["dlg-title"]'></anvil-component>
  <div class="ui-stack">
    <div class="ep-top">
      <label class="ui-field"><span>Emoji</span><anvil-component type="TextBox" name="emoji_box" prop:placeholder="🚀" prop:role='["ep-emoji"]'></anvil-component></label>
      <label class="ui-field"><span>Name</span><anvil-component type="TextBox" name="name_box" prop:placeholder="Pocket Garden"></anvil-component></label>
    </div>
    <div class="ui-field"><span>Colour</span>
      <div class="ap-colors" role="group" aria-label="Colour">
        <button type="button" data-col="#cc181e" class="sw-red" anvil:name="c1" anvil:on-dom:click="self.color_click" aria-label="Red"></button>
        <button type="button" data-col="#ff8a3d" class="sw-orange" anvil:name="c2" anvil:on-dom:click="self.color_click" aria-label="Orange"></button>
        <button type="button" data-col="#e6a700" class="sw-gold" anvil:name="c3" anvil:on-dom:click="self.color_click" aria-label="Gold"></button>
        <button type="button" data-col="#2e9d5b" class="sw-green" anvil:name="c4" anvil:on-dom:click="self.color_click" aria-label="Green"></button>
        <button type="button" data-col="#1fa2a2" class="sw-teal" anvil:name="c5" anvil:on-dom:click="self.color_click" aria-label="Teal"></button>
        <button type="button" data-col="#167ac6" class="sw-blue" anvil:name="c6" anvil:on-dom:click="self.color_click" aria-label="Blue"></button>
        <button type="button" data-col="#5b4ccf" class="sw-indigo" anvil:name="c7" anvil:on-dom:click="self.color_click" aria-label="Indigo"></button>
        <button type="button" data-col="#a83279" class="sw-plum" anvil:name="c8" anvil:on-dom:click="self.color_click" aria-label="Plum"></button>
        <button type="button" data-col="#444444" class="sw-grey" anvil:name="c9" anvil:on-dom:click="self.color_click" aria-label="Grey"></button>
        <anvil-component type="TextBox" name="color_box" prop:role='["ep-color"]'></anvil-component>
      </div>
    </div>
    <label class="ui-field"><span>Link</span><anvil-component type="TextBox" name="url_box" prop:placeholder="https://myapp.com"></anvil-component></label>
    <label class="ui-field"><span>What it does, in one line</span><anvil-component type="TextBox" name="tagline_box" prop:placeholder="Never forget to water a plant again"></anvil-component></label>
    <label class="ui-field"><span>Who it's for</span><anvil-component type="TextBox" name="audience_box" prop:placeholder="busy plant parents"></anvil-component></label>
    <label class="ui-field"><span>Best features <em>(one per line)</em></span><anvil-component type="TextArea" name="features_box" prop:height="100"></anvil-component></label>
    <label class="ui-field"><span>Call to action</span><anvil-component type="TextBox" name="cta_box" prop:placeholder="Try it free"></anvil-component></label>
    <label class="ui-field"><span>Notes <em>(just for you)</em></span><anvil-component type="TextArea" name="notes_box" prop:height="60"></anvil-component></label>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="save_button" prop:text="Save" prop:role='["btn", "btn-primary", "ic-check"]'></anvil-component>
    </div>
  </div>
</div>
