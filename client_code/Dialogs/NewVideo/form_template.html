<div class="ui nv-dialog">
  <h2 class="dlg-h">New video</h2>
  <div class="ui-stack">
    <label class="ui-field"><span>Title</span>
      <anvil-component type="TextBox" name="title_box" prop:placeholder="e.g. Pocket Garden in 60 seconds"></anvil-component>
    </label>
    <label class="ui-field"><span>About which app?</span>
      <anvil-component type="DropDown" name="product_box"></anvil-component>
    </label>
    <label class="ui-field"><span>Format</span>
      <anvil-component type="DropDown" name="kind_box"></anvil-component>
    </label>
    <div class="ui-grid two">
      <label class="ui-field"><span>Publish by <em>(optional)</em></span>
        <anvil-component type="TextBox" name="due_box"></anvil-component>
      </label>
      <label class="ui-field"><span>Start the script from</span>
        <anvil-component type="DropDown" name="tpl_box"></anvil-component>
      </label>
    </div>
    <anvil-component type="Label" name="message" prop:role='["msg-error"]' prop:visible="false"></anvil-component>
    <div class="ui-row end">
      <anvil-component type="Button" name="cancel_button" prop:text="Cancel" prop:role='["btn", "btn-ghost"]'></anvil-component>
      <anvil-component type="Button" name="create_button" prop:text="Create" prop:role='["btn", "btn-primary", "ic-plus"]'></anvil-component>
    </div>
  </div>
</div>
