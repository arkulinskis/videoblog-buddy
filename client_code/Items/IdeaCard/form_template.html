<div class="pl-idea-host">
  <div class="pl-idea">
    <anvil-component type="Label" name="kind" prop:role='["pl-idea-k"]' bind:text="self.item['kind_label']"></anvil-component>
    <anvil-component type="Label" name="title" prop:role='["pl-idea-t"]' bind:text="self.item['title']"></anvil-component>
    <anvil-component type="Label" name="done" prop:role='["badge", "badge-good", "pl-idea-done"]'></anvil-component>
    <anvil-component type="Button" name="plan_button" prop:role='["btn", "btn-sm", "ic-plus"]'></anvil-component>
  </div>
</div>
